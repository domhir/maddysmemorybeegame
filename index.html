<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
  <title>Memory Bee</title>
  <link rel="stylesheet" href="styles.css?5" />
</head>

<body>
  <!-- existing scripts -->
  <script src="libs/papaparse.js"></script>
  <script src="libs/alea.min.js"></script>
  <script src="js/words.js?5"></script>
  <script src="js/interface.js?5"></script>
  <script src="js/main.js?5"></script>

  <!-- your page structure omitted for brevity -->

  <div id="victory-popup" class="popup hidden">
    <div id="popup-content-alt">
      <img id="victory-img" src="img/victory.svg">
      <h1>Excellent work!</h1>
      <p id="victory-text">--------</p>
      <p>You've reached the highest rank, with&nbsp;<b id="victory-words"></b>&nbsp;and&nbsp;<b id="victory-points"></b>.</p>
      <p id="victory-countdown">Check back in&nbsp;<b id="victory-countdown-span">a bit</b>&nbsp;for a new puzzle.</p>
    </div>
    <span id="popup-exit-alt" onclick="hideVictoryPopup()"></span>
  </div>

  <script>
    document.body.classList.add("dark");
    element("toggle-dark").textContent = "";
    setDarkCookie();
    getDarkCookie();

    var returnPopupNotShownYet = true;

    window.onkeydown = function (e) {
      if (e.keyCode == 8 && e.target == document.body)
        e.preventDefault();
    };

    setUpKeyboardInput();
    setUpButtonFunctions();
    Papa.parse("data/words.csv?3", {
      download: true,
      complete: function (result) {
        let data = result.data.flat();
        newGame(data);
      },
    });

    // Test victory messages (replace with 89 total later)
    const victoryMessages = [
      "Message 1",
      "Message 2",
      "Message 3",
      "Message 4",
      "Message 5"
    ];

    function showVictoryMessage() {
      const randomIndex = Math.floor(Math.random() * victoryMessages.length);
      document.getElementById("victory-text").textContent = victoryMessages[randomIndex];
    }

    // Call this function when showing the victory popup
    // For testing, you can trigger it manually:
    // showVictoryMessage();
  </script>
</body>
</html>
